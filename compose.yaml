services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://task:${POSTGRES_PASSWORD}@db:5432/task
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:2240:2240"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2240/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: task
      POSTGRES_USER: task
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - task-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task -d task"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  task-db:
